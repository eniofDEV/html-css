<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1 {
            background-color: lightgray;
            
            height: 300px;
            width: 300px;
            
            border: 10px solid darkgray;

            padding: 20px 20px;

            margin: 20px auto;

            outline: 5px dashed aqua;
        }

        a {
            border: 2px solid red;

            padding: 10px 20px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de caixa inline-level</a> Vamos ver tudo isso funcionando</p>
</body>
</html>
